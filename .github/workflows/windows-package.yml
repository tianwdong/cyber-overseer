name: Windows installer
on: [workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:win
      - run: ./scripts/verify-windows-package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-installer
          path: |
            release/windows/*-setup.exe
            release/windows/*-setup.exe.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package-evidence
          path: |
            ${{ runner.temp }}/overseer-package-*.log
            ${{ runner.temp }}/cyber-overseer-smoke/*.png
